version: 2

before:
  hooks:
    - asciidoctor -b manpage docs/man/man1/glzip.1.adoc

builds:
  - main: ./cmd/glzip
    binary: glzip
    flags:
      - -trimpath
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - freebsd
      - linux
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.zst]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - AUTHORS.adoc
      - CHANGELOG.adoc
      - CONTRIBUTING.adoc
      - docs/man/man1/glzip.1
      - LICENSES/*
      - README.md

checksum:
  name_template: "b2sums.txt"
  algorithm: blake2b

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
